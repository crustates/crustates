# Provides the required status check `ci` on main and development (ruleset
# protect-main-and-development). Keep the job id `ci`: renaming it blocks every
# merge until the ruleset is updated as well.
#
# No toolchain action: rustup ships on the runner and installs the channel and
# components named in rust-toolchain.toml.
name: ci

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans every commit, not only the last one.
          fetch-depth: 0

      # gitleaks-action needs a paid licence for organisation repos, so this
      # runs the release binary, pinned by version and checksum.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner "$GITHUB_WORKSPACE"

      - name: Set up Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2

      - name: Format, lint, test, check dependencies
        run: cargo xtask ci
