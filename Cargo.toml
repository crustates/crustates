[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/crustates/crustates"
publish = false

[workspace.dependencies]
crust-agent = { path = "crates/crust-agent" }
crust-api = { path = "crates/crust-api" }
crust-proto = { path = "crates/crust-proto" }
crust-reconcile = { path = "crates/crust-reconcile" }
crust-store = { path = "crates/crust-store" }
crust-types = { path = "crates/crust-types" }

anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
futures = "0.3.34"
http-body-util = "0.1.5"
jiff = { version = "0.2.38", features = ["serde"] }
prost = "0.14.4"
protox = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "migrate", "macros", "runtime-tokio", "sqlite-bundled"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
tokio-util = "0.7.20"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["jiff_0_2", "uuid"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
