# cargo-deny: run by `cargo xtask ci`. Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every advisory in the RustSec database fails the check, including
# unmaintained crates and yanked versions.
yanked = "deny"

[licenses]
# Licences compatible with the AGPL-3.0-or-later platform (ADR 0005). Add one
# only when a dependency needs it and it is compatible with the AGPL.
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates have `publish = false`; their licence is set in Cargo.toml.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
