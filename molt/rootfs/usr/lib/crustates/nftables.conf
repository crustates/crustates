#!/usr/sbin/nft -f
# Molt host firewall: from outside, only the Crustates API is reachable.
# Loaded by nftables.service (see its crustates.conf drop-in).

table inet crustates
delete table inet crustates

table inet crustates {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iif lo accept
        # Ping, and ICMPv6, without which IPv6 neighbour discovery breaks.
        meta l4proto { icmp, ipv6-icmp } accept
        # DHCP and DHCPv6 replies to this host's own lease requests.
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept
        # The Crustates API (CRUST_LISTEN).
        tcp dport 8080 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
