# Holds local overrides such as crust-api.env; the image defaults live in
# /usr/lib/crustates.
d /etc/crustates 0755 root root -
# The API's local socket and what the console reads: the first-boot secrets
# (root only) and the health check's progress (ADR 0018).
d /run/crustates 0770 root crustates -
